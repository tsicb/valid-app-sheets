<script>
/* valid-app-sheets: browser-only CSV parser + data projection.
 * NO raw applicant name, email, telephone or street address is returned.
 * Public testing hook: VAS_IMPORT.buildModel / parseCsvText.
 */
const VAS_IMPORT = (() => {
  'use strict';
  const APP_FIELDS = [
    'レコードID','企業ID','仕事番号','求人参照ID','求人データ突合フラグ',
    '応募日付','応募年月','月内応募日','応募曜日','応募時間',
    '応募数','対応状況','応募媒体','年齢','性別','氏名文字種区分',
    '居住都道府県','勤務地・居住都道府県一致','職種','雇用形態',
    '勤務地都道府県','求人勤務地名称','求人分析情報ソース'
  ];
  const JOB_FIELDS = [
    '求人参照ID','求人分析情報ソース','企業ID','仕事番号','求人管理番号',
    '仕事名','職種','雇用形態','募集背景','求人勤務地名称',
    '勤務地都道府県','求人備考','給与区分コード','給与金額MIN',
    'メイン画像ファイル名','求人画像枚数','求人動画あり',
    'Indeed求人タグコード','Indeed求人タグ数','求人原稿文字数'
  ];
  const IMAGE_FIELDS = ['画像ファイル名','公開求人候補ID','画像URL','取得状態','最終取得日時'];
  const JOB_LENGTH_KEYS = [
    '仕事内容','職種','雇用形態','求人勤務地名称','勤務地1','最寄駅1',
    '雇用形態備考','キャッチコピー','インフォメーション','勤務時間',
    '休日・休暇','給与備考','月収例','年収例','待遇・福利厚生',
    '応募資格','選考手順','面接地住所','アピールポイント',
    '醍醐味','厳しさ','こんな人が活躍','特徴'
  ];
  const s = x => x == null ? '' : String(x).trim();
  const v = (r, names) => {
    for (const n of names) if (r && Object.prototype.hasOwnProperty.call(r,n) && s(r[n])) return r[n];
    return '';
  };
  const getPref = raw => {
    const m = s(raw).match(/^(東京都|北海道|(?:京都|大阪)府|.{2,3}県)/);
    return m ? m[1] : '';
  };
  const jobKey = raw => s(raw).toUpperCase().replace(/_[0-9]{3,8}$|§.*/g, '');
  const company = r => s(v(r,['企業コード','企業ID','応募先企業ID'])).toUpperCase();
  const makeKey = (id,number) => s(id).toUpperCase()+'_'+jobKey(number);
  const normalizeGender = raw => {
    const x=s(raw);
    return x==='男'||x==='男性' ? '男性' : x==='女'||x==='女性' ? '女性' :
      (x===''||x==='不明' ? '不明' : x);
  };
  const parseAge = x => {
    const m=s(x).match(/^(\d{1,3})(?:歳)?$/);
    return m?Number(m[1]):'';
  };
  const parseStamp = x => {
    const m=s(x).match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})(?:[ T](\d{1,2})(?::\d{1,2})?(?::\d{1,2})?)?/);
    if(!m) return {day:'',month:'',date:'',weekday:'',hour:''};
    const y=Number(m[1]),mo=Number(m[2]),d=Number(m[3]),h=m[4]===undefined?'':Number(m[4]);
    const dt=new Date(Date.UTC(y,mo-1,d));
    if(dt.getUTCFullYear()!==y||dt.getUTCMonth()!==mo-1||dt.getUTCDate()!==d ||
       (h!==''&&(h<0||h>23))) return {day:'',month:'',date:'',weekday:'',hour:''};
    const z=n=>String(n).padStart(2,'0');
    return {day:d,month:y+'-'+z(mo),date:y+'-'+z(mo)+'-'+z(d),
      weekday:['日','月','火','水','木','金','土'][dt.getUTCDay()],hour:h};
  };
  const fromNumber = x => {
    const raw=s(x).replace(/,/g,'');
    if(!raw) return '';
    const n=Number(raw);
    return Number.isFinite(n)?n:'';
  };
  const tagCount = x => s(x).split('::').filter(y=>s(y)).length;
  const imageCount = j => [
    'メイン画像データファイルタイトル','サブ画像1データファイルタイトル',
    'サブ画像2データファイルタイトル','サブ画像3データファイルタイトル'
  ].filter(x=>s(j[x])).length;

  /**
   * RFC 4180-ish parser: supports quoted fields, escaped quotes, multiline,
   * CRLF, UTF-8 BOM, and blank rows. Strict malformed quotes are rejected.
   * Parsing is entirely in the browser.
   */
  function parseCsvText(input) {
    const text=String(input||'').replace(/^\uFEFF/,'');
    const lines=[];let row=[],field='',quoted=false,afterQuote=false,atStart=true;
    const push=()=>{row.push(field);field='';afterQuote=false;atStart=true;};
    const end=()=>{push();if(row.some(x=>x!=='')) lines.push(row);row=[];};
    for(let i=0;i<text.length;i++){
      const c=text[i];
      if(quoted){
        if(c==='"'){
          if(text[i+1]==='"'){field+='"';i++;}
          else {quoted=false;afterQuote=true;}
        } else field+=c;
        continue;
      }
      if(afterQuote){
        if(c===','){push();continue;}
        if(c==='\r'||c==='\n'){if(c==='\r'&&text[i+1]==='\n')i++;end();continue;}
        if(c===' '||c==='\t')continue;
        throw new Error('引用符の直後に不正な文字があります。CSV構造を確認してください。');
      }
      if(c==='"'){
        if(!atStart)throw new Error('引用符の位置が不正です。CSV構造を確認してください。');
        quoted=true;atStart=false;
      } else if(c===',')push();
      else if(c==='\r'||c==='\n'){if(c==='\r'&&text[i+1]==='\n')i++;end();}
      else {field+=c;atStart=false;}
    }
    if(quoted)throw new Error('CSVの引用符が閉じていません。');
    if(field!==''||row.length||afterQuote)end();
    if(!lines.length)throw new Error('CSVにデータがありません。');
    const heads=lines.shift().map(x=>s(x).replace(/^\uFEFF/,''));
    if(heads.some(x=>!x))throw new Error('CSVの見出しに空欄があります。');
    if(new Set(heads).size!==heads.length)throw new Error('CSVの見出しに重複があります。');
    const rows=lines.map((cells,i)=>{
      if(cells.length!==heads.length)throw new Error('CSVの'+(i+2)+'行目は列数が異なります。');
      return Object.fromEntries(heads.map((h,k)=>[h,cells[k]]));
    });
    return {headers:heads,rows};
  }
  function validateInput(parsed,kind) {
    const set=new Set(parsed.headers), required=(kind==='app'?
      [['仕事番号','お仕事NO','応募求人ID'],['応募日時','応募日'],
       ['氏名','応募者名'],['企業コード','企業ID','応募先企業ID']]
      :[['仕事番号'],['仕事名'],['求人管理番号'],['企業ID','企業コード']]);
    const missing=required.filter(g=>!g.some(x=>set.has(x)));
    if(missing.length)throw new Error(
      (kind==='app'?'応募CSV':'求人CSV')+'の必須列が不足しています：'+
      missing.map(g=>g.join(' または ')).join('、'));
    return true;
  }
  function canonicalApp(raw) {
    const format=raw['応募先企業ID']!==undefined&&raw['応募求人ID']!==undefined?'B':'A';
    const work= format==='B'
      ? ['求人都道府県','求人市区町村','求人勤務地住所'].map(x=>s(raw[x])).join('')
      : v(raw,['勤務地1','求人都道府県']);
    return {
      company:company(raw),number:s(v(raw,['仕事番号','お仕事NO','応募求人ID'])),
      datetime:s(v(raw,['応募日時','応募日'])),
      name:s(v(raw,['氏名','応募者名'])),
      media:s(v(raw,['応募媒体','応募媒体名'])),
      status:s(v(raw,['対応状況','応募者対応ステータス（企業）'])),
      home:getPref(v(raw,['都道府県','住所'])),
      gender:normalizeGender(raw['性別']),age:parseAge(raw['年齢']),
      location:s(work),locationName:s(v(raw,['求人勤務地名称','勤務地名1'])),
      raw
    };
  }
  function canonicalJob(raw){
    const out={...raw};
    if(!s(out['仕事番号']))out['仕事番号']=v(raw,['お仕事NO']);
    if(!s(out['勤務地1']))out['勤務地1']=v(raw,['求人勤務地住所','求人都道府県']);
    if(!s(out['求人勤務地名称']))out['求人勤務地名称']=v(raw,['勤務地名1']);
    if(!s(out['求人備考']))out['求人備考']=v(raw,['掲載仕事備考']);
    return out;
  }
  function jobMeta(app,job,matched){
    const ar=app.raw;
    const preferred=(field,aliases=[])=>matched?
      v(job,[field,...aliases])||v(ar,[field,...aliases]):
      v(ar,[field,...aliases]);
    const location=preferred('勤務地1',['求人都道府県']);
    const main=matched?s(job['メイン画像データファイルタイトル']):'';
    const tags=matched?s(job['Indeed用求人関連タグ']):'';
    const rawName=preferred('仕事名');
    const employment=preferred('雇用形態',['就業形態']);
    const locName=preferred('求人勤務地名称',['勤務地名1']);
    const recruit=preferred('募集背景');
    const notes=preferred('求人備考',['掲載仕事備考']); // full raw job notes
    const textLength=matched?JOB_LENGTH_KEYS.reduce((n,key)=>
      n+s(job[key]).replace(/<br\s*\/?>/gi,'').length,0):'';
    const values=[
      '', matched?'JOB_CSV':'APPLICATION_EMBEDDED',app.company,app.number,
      matched?s(job['求人管理番号']):'',s(rawName),
      s(preferred('職種')),s(employment),s(recruit),s(locName),
      s(v(job||{},['勤務地都道府県']))||getPref(location),
      String(notes||''),matched?s(job['給与区分']):'',
      matched?fromNumber(job['給与金額MIN']):'',
      main,matched?imageCount(job):'',
      matched?(s(job['動画タイトル'])?1:0):'',
      tags,matched?tagCount(tags):'',textLength
    ];
    const hasEmbedded = ['仕事名','職種','雇用形態','求人勤務地名称','勤務地1','求人備考','募集背景','掲載仕事備考','勤務地名1']
      .some(k=>s(ar[k]));
    return matched||hasEmbedded?values:null;
  }
  function mergeJob(existing,candidate) {
    const preferCandidate=candidate[1]==='JOB_CSV'&&existing[1]!=='JOB_CSV';
    if(preferCandidate) existing[1]='JOB_CSV';
    for(let i=2;i<existing.length;i++){
      if((preferCandidate&&s(candidate[i]))||!s(existing[i]))existing[i]=candidate[i];
    }
  }
  function buildModel(appInputs,jobInputs) {
    const jobs=jobInputs.flatMap(x=>x.parsed.rows.map(canonicalJob));
    const jobMap=new Map();
    jobs.forEach(j=>{
      const num=jobKey(j['仕事番号']),co=company(j);
      if(num&&!jobMap.has(makeKey(co,num)))jobMap.set(makeKey(co,num),j);
    });
    const applications=appInputs.flatMap(x=>x.parsed.rows.map(canonicalApp));
    const seen=new Set(),kept=[];let duplicates=0;
    for(const a of applications){
      const dt=parseStamp(a.datetime), dedupe=dt.month&&a.name?dt.month.replace('-','')+'_'+a.name:'';
      if(dedupe&&seen.has(dedupe)){duplicates++;continue;}
      if(dedupe)seen.add(dedupe);
      kept.push({a,dt});
    }
    const map=new Map(),masters=[],applicationRows=[];
    let nextJob=1,matchedCount=0,embeddedCount=0,invalidDateCount=0;
    for(let i=0;i<kept.length;i++){
      const {a,dt}=kept[i];
      if(!dt.date)invalidDateCount++;
      const key=makeKey(a.company,a.number);
      const matched=a.number&&jobMap.has(key);
      const j=matched?jobMap.get(key):null;
      const meta=jobMeta(a,j||{},!!matched);
      let ref='',source='';
      if(meta&&a.number){
        if(!map.has(key)){
          ref='JOB'+String(nextJob++).padStart(6,'0');
          meta[0]=ref;masters.push(meta);map.set(key,meta);
        }else{const cur=map.get(key);mergeJob(cur,meta);ref=cur[0];}
        ref=map.get(key)[0];
        source=map.get(key)[1];
      }
      if(matched)matchedCount++;
      else if(meta)embeddedCount++;
      const pRef=meta?(s(v(j||{},['勤務地都道府県']))||getPref(j&&j['勤務地1']||a.location)):'';
      const workPref=meta?s(meta[10]):getPref(a.location);
      const locMatch=workPref&&a.home?(workPref===a.home?1:0):'';
      const rec=[
        'APP'+String(i+1).padStart(6,'0'),a.company,a.number,ref,matched?1:0,
        dt.date,dt.month,dt.day,dt.weekday,dt.hour,dt.date?1:0,a.status,
        a.media,a.age,a.gender,a.name?(/[\u4E00-\u9FFF]/.test(a.name)?'漢字を含む':'漢字を含まない'):'',
        a.home,locMatch,meta?s(meta[6]):'',meta?s(meta[7]):'',
        workPref,meta?s(meta[9]):'',source
      ];
      applicationRows.push(rec);
    }
    // Resolve final source flags after an embedded meta is superseded by job CSV.
    const sourceByRef=new Map(masters.map(r=>[r[0],r[1]]));
    applicationRows.forEach(r=>{if(r[3])r[22]=sourceByRef.get(r[3])||'';});
    const imageTargets=new Set(masters.filter(r=>r[1]==='JOB_CSV'&&s(r[14])).map(r=>s(r[14])));
    const candidates=new Map();
    jobs.forEach(j=>{
      const img=s(j['メイン画像データファイルタイトル']),id=s(j['求人管理番号']);
      if(!imageTargets.has(img)||s(j['公開情報区分'])!=='6'||!/^[0-9]+$/.test(id))return;
      if(!candidates.has(img))candidates.set(img,[]);
      const a=candidates.get(img);if(!a.includes(id))a.push(id);
    });
    const imageRows=[...imageTargets].map(img=>[
      img,(candidates.get(img)||[]).join('::'),'',
      candidates.has(img)?'未取得':'候補なし',''
    ]);
    return {
      applicationData:applicationRows,jobAnalysisMaster:masters,imageCandidates:imageRows,
      headers:{applicationData:APP_FIELDS,jobAnalysisMaster:JOB_FIELDS,imageCandidates:IMAGE_FIELDS},
      summary:{
        incomingApplications:applications.length,duplicateCount:duplicates,
        totalApplications:applicationRows.length,matchedApplications:matchedCount,
        embeddedApplications:embeddedCount,jobRecords:masters.length,
        imageTargets:imageRows.length,invalidDateCount
      }
    };
  }
  return {parseCsvText,validateInput,buildModel,
    columns:{applicationData:APP_FIELDS,jobAnalysisMaster:JOB_FIELDS,imageCandidates:IMAGE_FIELDS}};
})();
</script>
